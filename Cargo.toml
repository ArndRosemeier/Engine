[workspace]
resolver = "2"
members = [
    "engine",
    "examples/hello_mesh",
    "examples/occlusion_city",
    "examples/procedural_caves",
    "examples/gpu_field_demo",
    "examples/populate_world",
    "examples/infinite_walker",
    "examples/ui_modal",
    "examples/animated_animal",
    "examples/portals",
    "examples/portal_pair",
    "examples/material_showcase",
    "examples/vfx_showcase",
    "examples/voxel_destruction",
    "examples/model_viewer",
    "examples/lod_forest",
    "examples/sky_day",
    "examples/texgen",
    "examples/vegetation",
    "examples/starter",
    "examples/water",
    "examples/coast",
    "examples/island",
    "examples/physics",
    "examples/gameplay",
    "examples/lamps",
    "examples/prefabs",
    "examples/characters",
    "examples/fixed_tick",
    "examples/ragdolls",
    "examples/crowds",
    "examples/decals",
    "examples/fog_volumes",
    "examples/moons",
    "examples/interiors",
    "examples/reflections",
    "examples/buildings",
    "examples/navigation",
    "examples/zfight",
    "examples/open_world",
    "examples/particles",
    "examples/audio",
]
default-members = ["engine"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
engine = { path = "engine" }
bytemuck = { version = "1.22", features = ["derive"] }
egui = "0.32.3"
egui-wgpu = "0.32.3"
egui-winit = "0.32.3"
glam = { version = "0.33", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = true, features = ["utils", "extras", "extensions", "KHR_materials_emissive_strength", "KHR_texture_transform"] }
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9"
pollster = "0.4"
rayon = "1.10"
rapier3d = "0.36"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
rodio = "0.21"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
wgpu = "25"
winit = "0.30"
meshopt = "0.7"

# Generators and the renderer crawl without optimisation, so debug builds
# optimise dependencies (and the engine) while your own code stays quick to build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# wgpu 25 never frees render bundles; see third_party/README.md.
[patch.crates-io]
wgpu = { path = "third_party/wgpu-25.0.2" }
