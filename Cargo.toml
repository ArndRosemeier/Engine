[workspace]
resolver = "2"
members = [
    "engine",
    "examples/hello_mesh",
    "examples/procedural_caves",
    "examples/gpu_field_demo",
    "examples/populate_world",
    "examples/infinite_walker",
    "examples/ui_modal",
    "examples/animated_animal",
    "examples/portals",
    "examples/portal_pair",
    "examples/material_showcase",
    "examples/vfx_showcase",
]
default-members = ["engine"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.lints.rust]
warnings = "deny"

[workspace.dependencies]
engine = { path = "engine" }
bytemuck = { version = "1.22", features = ["derive"] }
egui = "0.32.3"
egui-wgpu = "0.32.3"
egui-winit = "0.32.3"
glam = { version = "0.30", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = true, features = ["utils"] }
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9"
pollster = "0.4"
rayon = "1.10"
rodio = "0.21"
thiserror = "2"
wgpu = "25"
winit = "0.30"
