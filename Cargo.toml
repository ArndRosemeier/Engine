[workspace]
resolver = "2"
members = [
    "engine",
    "examples/hello_mesh",
    "examples/procedural_caves",
    "examples/populate_world",
    "examples/infinite_walker",
]
default-members = ["engine"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
engine = { path = "engine" }
bytemuck = { version = "1.22", features = ["derive"] }
glam = { version = "0.30", features = ["bytemuck"] }
gltf = { version = "1.4", default-features = true, features = ["utils"] }
image = { version = "0.25", default-features = false, features = ["png"] }
noise = "0.9"
pollster = "0.4"
rayon = "1.10"
thiserror = "2"
wgpu = "25"
winit = "0.30"
