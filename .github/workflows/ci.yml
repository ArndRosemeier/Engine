name: ci

# Every pull request into main (and every push to main) must build, pass the
# tests and be clippy-clean on Windows and Linux. See "Testing" in README.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Clippy gains lints with every Rust release; a pinned toolchain keeps CI
  # from going red on its own. Raise it on purpose and fix what it finds.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (audio, input)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy (engine and every example)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p engine
