name: ci

# Every pull request into main (and every push to main) must build, pass the
# tests and be clippy-clean on Windows and Linux. See "Testing" in README.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Clippy gains lints with every Rust release; a pinned toolchain keeps CI
  # from going red on its own. Raise it on purpose and fix what it finds.
  RUST_TOOLCHAIN: "1.97.0"

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (audio, input)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Clippy (engine and every example)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test -p engine

  # Run examples headless on a software GPU (lavapipe) as verify runs: they
  # must reach their last frame and every world.check() must hold. See
  # "Verify runs" in README.md.
  verify:
    name: verify examples
    runs-on: ubuntu-latest
    env:
      ENGINE_AUDIO: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages (audio, input, software Vulkan, virtual display, X11 libraries winit loads at run time)
        run: >
          sudo apt-get update && sudo apt-get install -y
          libasound2-dev libudev-dev mesa-vulkan-drivers xvfb
          libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2

      - name: Rust ${{ env.RUST_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2

      - name: hello_mesh
        run: python3 tools/verify.py hello_mesh --width 640 --height 360

      - name: physics (nothing sinks into the ground)
        run: python3 tools/verify.py physics --frames 240 --width 640 --height 360

      - name: gameplay (character, door, stairs, coins, rope)
        run: python3 tools/verify.py gameplay --frames 600 --width 640 --height 360

      - name: anim_states (state machine, clip events)
        run: python3 tools/verify.py anim_states --frames 780 --width 640 --height 360

      - name: glass (see-through things sorted far to near)
        run: python3 tools/verify.py glass --frames 60 --width 640 --height 360

      - name: Keep the reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify
          path: target/verify/
